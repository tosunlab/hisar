name: Release CLI

# Called by the Release workflow with a cli-<version> tag: builds hisar for Linux, macOS and Windows into the artifact
# release-files-cli-archives, which the Release workflow puts on the GitHub prerelease.
on:
  workflow_call:
    inputs:
      tag:
        description: The cli-<version> tag to build
        type: string
        required: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  cli-release-build:
    name: Build hisar for Linux, macOS and Windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Build the release archives and SHA256SUMS
        run: |
          version=${TAG#cli-}
          bash scripts/package-cli-release.sh "$version" cli-release
          tar -xzf "cli-release/hisar-$version-linux-amd64.tar.gz" -C "$RUNNER_TEMP" hisar
          test "$("$RUNNER_TEMP/hisar" --version)" = "hisar $version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files-cli-archives
          path: cli-release/
          if-no-files-found: error
          retention-days: 7
