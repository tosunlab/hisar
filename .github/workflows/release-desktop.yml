name: Release desktop

# Called by the Release workflow with a desktop-<version> tag: builds the DMG and, for release versions, the Sparkle-signed
# update, plus the Linux .deb, .rpm, AppImage and Flatpak and, for release versions, their .sig files, each job into its
# own release-files-desktop-* artifact; the Release workflow puts them all on the GitHub prerelease. update.json is saved
# as update-unpublished.json; the Publish workflow renames it, which offers the version to apps.
on:
  workflow_call:
    inputs:
      tag:
        description: The desktop-<version> tag to build
        type: string
        required: true
    secrets:
      SPARKLE_PRIVATE_KEY:
        required: false
      MACOS_SIGNING_CERTIFICATE:
        required: false
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        required: false
      MACOS_PROVISIONING_PROFILE:
        required: false
      APPLE_NOTARY_KEY:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false
  XCODE_PATH: /Applications/Xcode_26.6.app

jobs:
  desktop-dmg:
    name: Build the universal Hisar.app DMG and Sparkle update
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The commit the Release run tagged, not the tag, which could be moved during the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # The tag's annotation holds the release notes.
      - name: Fetch the annotated tag
        run: git fetch --force origin "+refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH" && xcodebuild -version
      # Only whether the Sparkle key is set: the key itself reaches no step before "Sign the Sparkle update".
      - name: Check the version and that the Sparkle key is set
        env:
          HAS_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
        run: |
          version=${TAG#desktop-}
          bash scripts/get-build-number.sh "$version"
          case "$version" in *-*) isCustomBuild=true ;; *) isCustomBuild=false ;; esac
          if ! $isCustomBuild && ! $HAS_SPARKLE_PRIVATE_KEY; then
            echo "set the repository secret SPARKLE_PRIVATE_KEY (Sparkle's EdDSA private key)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IS_CUSTOM_BUILD=$isCustomBuild" >> "$GITHUB_ENV"
      - name: Install dmgbuild and Wails
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild" && "$RUNNER_TEMP/dmgbuild/bin/pip" install -q dmgbuild==1.6.5
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make install-wails
      # The Developer ID identity and matching macOS profile authorize the data-protection keychain.
      - name: Import the signing identity and the notary key
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_SIGNING_CERTIFICATE" ]; then
            $IS_CUSTOM_BUILD || { echo "set the repository secrets MACOS_SIGNING_CERTIFICATE (base64 Developer ID .p12) and MACOS_SIGNING_CERTIFICATE_PASSWORD"; exit 1; }
            echo "No MACOS_SIGNING_CERTIFICATE: this custom build is ad-hoc signed and not notarized"
            exit 0
          fi
          if [ -z "$MACOS_PROVISIONING_PROFILE" ]; then
            echo "set MACOS_PROVISIONING_PROFILE to a base64 macOS Developer ID profile with this app's keychain access group"
            exit 1
          fi
          if [ -z "$APPLE_NOTARY_KEY" ] || [ -z "$APPLE_NOTARY_KEY_ID" ] || [ -z "$APPLE_NOTARY_ISSUER_ID" ]; then
            echo "set the repository secrets APPLE_NOTARY_KEY (base64 .p8), APPLE_NOTARY_KEY_ID and APPLE_NOTARY_ISSUER_ID"
            exit 1
          fi
          umask 077
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/Hisar.provisionprofile"
          echo "HISAR_MACOS_PROVISIONING_PROFILE=$RUNNER_TEMP/Hisar.provisionprofile" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "HISAR_NOTARY_KEY=$RUNNER_TEMP/notary-key.p8"
            echo "HISAR_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"
            echo "HISAR_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychainPassword=$(openssl rand -hex 32)
          printf '%s' "$MACOS_SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychainPassword" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychainPassword" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          # The identity's issuer, so the chain verifies when the .p12 export did not carry it.
          if ! security find-certificate -c "Developer ID Certification Authority" "$keychain" >/dev/null 2>&1; then
            curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychainPassword" "$keychain" >/dev/null
          # Keeps the runner's keychains searchable; their paths have no spaces. (macOS bash 3.2 has no mapfile.)
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # -v lists only identities whose chain verifies, so a missing intermediate certificate fails here.
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: .*\(589NVZWDWZ\)"/ {print $2; exit}')
          test -n "$identity" || { security find-identity -p codesigning "$keychain"; echo "the .p12 has no valid Developer ID Application identity of team 589NVZWDWZ"; exit 1; }
          echo "HISAR_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build, notarize and staple the DMG
        run: bash scripts/package-desktop-dmg.sh "$VERSION"
      # The tag's annotation is the release notes; a lightweight tag gets "Hisar <version>".
      - name: Sign the Sparkle update
        if: env.IS_CUSTOM_BUILD == 'false'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          (umask 077 && printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private-key")
          : > "$RUNNER_TEMP/release-notes.md"
          if [ "$(git cat-file -t "refs/tags/$TAG")" = tag ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > "$RUNNER_TEMP/release-notes.md"
          fi
          bash scripts/package-desktop-update.sh "$VERSION" "$RUNNER_TEMP/sparkle-private-key" "$RUNNER_TEMP/release-notes.md"
          cp desktop/bin/update.json desktop/bin/update-unpublished.json
      - name: Save the files for the GitHub prerelease
        run: |
          mkdir release-files
          cp "desktop/bin/Hisar-$VERSION.dmg" release-files/
          if ! $IS_CUSTOM_BUILD; then cp "desktop/bin/Hisar-$VERSION.zip" desktop/bin/update-unpublished.json release-files/; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files-desktop-macos
          path: release-files/
          if-no-files-found: error
          retention-days: 7
      - name: Remove the Sparkle key, the notary key and the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sparkle-private-key" "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary-key.p8"
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN"; fi

  desktop-linux:
    name: Build the Linux .deb, .rpm and AppImage (${{ matrix.architecture }})
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: node:24-trixie@sha256:ff054b356ab93ed540518ca23cfcd9840e5256dd04db5a8d8afc43f4ecc7c9f8
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Install GTK 4 and WebKitGTK
        run: bash scripts/ci-apt-install.sh libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH" && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make install-wails
      - name: Build the packages
        shell: bash
        run: bash scripts/package-desktop-linux.sh "${TAG#desktop-}"
      - name: Save them for the GitHub prerelease
        shell: bash
        run: |
          version=${TAG#desktop-}
          mkdir release-files
          cd desktop/bin
          allFile=("Hisar-$version-linux-${{ matrix.architecture }}".{deb,rpm,AppImage})
          sha256sum "${allFile[@]}" > "SHA256SUMS-linux-${{ matrix.architecture }}"
          cp "${allFile[@]}" "SHA256SUMS-linux-${{ matrix.architecture }}" "$GITHUB_WORKSPACE/release-files/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files-desktop-linux-${{ matrix.architecture }}
          path: release-files/
          if-no-files-found: error
          retention-days: 7

  desktop-flatpak:
    name: Build the Linux Flatpak (${{ matrix.architecture }})
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The image has git, Node and flatpak-builder.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the Flatpak
        run: bash scripts/package-desktop-flatpak.sh "${TAG#desktop-}"
      - name: Save it for the GitHub prerelease
        shell: bash
        run: |
          version=${TAG#desktop-}
          mkdir release-files
          cd desktop/bin
          file="Hisar-$version-linux-${{ matrix.architecture }}.flatpak"
          sha256sum "$file" > "SHA256SUMS-flatpak-${{ matrix.architecture }}"
          cp "$file" "SHA256SUMS-flatpak-${{ matrix.architecture }}" "$GITHUB_WORKSPACE/release-files/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files-desktop-flatpak-${{ matrix.architecture }}
          path: release-files/
          if-no-files-found: error
          retention-days: 7

  # The Linux app installs an update only with the release's signature over the package's name and content, made with
  # the key that signs the Mac's Sparkle update (crypt.SignDesktopPackage; desktop/updater checks it). A custom build
  # is never offered as an update, so it has no signatures. The key reaches only the signing step.
  desktop-linux-signatures:
    name: Sign the Linux packages for in-app updates
    needs: [desktop-linux, desktop-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Skip a custom build
        run: |
          version=${TAG#desktop-}
          case "$version" in *-*) isCustomBuild=true ;; *) isCustomBuild=false ;; esac
          echo "IS_CUSTOM_BUILD=$isCustomBuild" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.IS_CUSTOM_BUILD == 'false'
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.IS_CUSTOM_BUILD == 'false'
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.IS_CUSTOM_BUILD == 'false'
        with:
          pattern: release-files-desktop-{linux,flatpak}-*
          path: packages
          merge-multiple: true
      - name: Sign the packages
        if: env.IS_CUSTOM_BUILD == 'false'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          version=${TAG#desktop-}
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "set the repository secret SPARKLE_PRIVATE_KEY (Sparkle's EdDSA private key)"; exit 1; }
          (umask 077 && printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/update-private-key")
          allFile=()
          for architecture in amd64 arm64; do
            for kind in deb rpm AppImage flatpak; do allFile+=("$GITHUB_WORKSPACE/packages/Hisar-$version-linux-$architecture.$kind"); done
          done
          (cd desktop && go run ./cmd/hisar-update-key sign "$RUNNER_TEMP/update-private-key" "${allFile[@]}")
          mkdir release-files
          for file in "${allFile[@]}"; do cp "$file.sig" release-files/; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.IS_CUSTOM_BUILD == 'false'
        with:
          name: release-files-desktop-linux-signatures
          path: release-files/
          if-no-files-found: error
          retention-days: 7
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-private-key"
