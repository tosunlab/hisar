name: Release desktop

# Called by the Release workflow with a desktop-<version> tag: builds the DMG and, for release versions, the Sparkle-signed
# update, plus the Linux .deb, .rpm, AppImage and Flatpak, each job into its own release-files-desktop-* artifact; the
# Release workflow puts them all on the GitHub prerelease. update.json is saved as update-unpublished.json; the Publish
# workflow renames it, which offers the version to apps.
on:
  workflow_call:
    inputs:
      tag:
        description: The desktop-<version> tag to build
        type: string
        required: true
    secrets:
      SPARKLE_PRIVATE_KEY:
        required: false

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false
  XCODE_PATH: /Applications/Xcode_26.6.app

jobs:
  desktop-dmg:
    name: Build the universal Hisar.app DMG and Sparkle update
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      # Checking out a tag can drop its annotation, which holds the release notes.
      - name: Fetch the annotated tag
        run: git fetch --force origin "+refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH" && xcodebuild -version
      - name: Check the version and the Sparkle key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          version=${TAG#desktop-}
          bash scripts/get-build-number.sh "$version"
          case "$version" in *-*) isCustomBuild=true ;; *) isCustomBuild=false ;; esac
          if ! $isCustomBuild; then
            test -n "$SPARKLE_PRIVATE_KEY" || { echo "set the repository secret SPARKLE_PRIVATE_KEY (Sparkle's EdDSA private key)"; exit 1; }
            umask 077
            printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private-key"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IS_CUSTOM_BUILD=$isCustomBuild" >> "$GITHUB_ENV"
      - name: Install dmgbuild and Wails
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild" && "$RUNNER_TEMP/dmgbuild/bin/pip" install -q dmgbuild==1.6.5
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make install-wails
      - name: Build the DMG
        run: bash scripts/package-desktop-dmg.sh "$VERSION"
      # The tag's annotation is the release notes; a lightweight tag gets "Hisar <version>".
      - name: Sign the Sparkle update
        if: env.IS_CUSTOM_BUILD == 'false'
        run: |
          : > "$RUNNER_TEMP/release-notes.md"
          if [ "$(git cat-file -t "refs/tags/$TAG")" = tag ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > "$RUNNER_TEMP/release-notes.md"
          fi
          bash scripts/package-desktop-update.sh "$VERSION" "$RUNNER_TEMP/sparkle-private-key" "$RUNNER_TEMP/release-notes.md"
          cp desktop/bin/update.json desktop/bin/update-unpublished.json
      - name: Save the files for the GitHub prerelease
        run: |
          mkdir release-files
          cp "desktop/bin/Hisar-$VERSION.dmg" release-files/
          if ! $IS_CUSTOM_BUILD; then cp "desktop/bin/Hisar-$VERSION.zip" desktop/bin/update-unpublished.json release-files/; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files-desktop-macos
          path: release-files/
          if-no-files-found: error
          retention-days: 7
      - name: Remove the Sparkle key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-private-key"

  desktop-linux:
    name: Build the Linux .deb, .rpm and AppImage (${{ matrix.architecture }})
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: node:24-trixie
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Install git, GTK 4 and WebKitGTK
        run: apt-get update -qq && apt-get install -y -qq git libgtk-4-dev libwebkitgtk-6.0-dev >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH" && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make install-wails
      - name: Build the packages
        shell: bash
        run: bash scripts/package-desktop-linux.sh "${TAG#desktop-}"
      - name: Save them for the GitHub prerelease
        shell: bash
        run: |
          version=${TAG#desktop-}
          mkdir release-files
          cd desktop/bin
          allFile=("Hisar-$version-linux-${{ matrix.architecture }}".{deb,rpm,AppImage})
          sha256sum "${allFile[@]}" > "SHA256SUMS-linux-${{ matrix.architecture }}"
          cp "${allFile[@]}" "SHA256SUMS-linux-${{ matrix.architecture }}" "$GITHUB_WORKSPACE/release-files/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files-desktop-linux-${{ matrix.architecture }}
          path: release-files/
          if-no-files-found: error
          retention-days: 7

  desktop-flatpak:
    name: Build the Linux Flatpak (${{ matrix.architecture }})
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The image has git, Node and flatpak-builder.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the Flatpak
        run: bash scripts/package-desktop-flatpak.sh "${TAG#desktop-}"
      - name: Save it for the GitHub prerelease
        shell: bash
        run: |
          version=${TAG#desktop-}
          mkdir release-files
          cd desktop/bin
          file="Hisar-$version-linux-${{ matrix.architecture }}.flatpak"
          sha256sum "$file" > "SHA256SUMS-flatpak-${{ matrix.architecture }}"
          cp "$file" "SHA256SUMS-flatpak-${{ matrix.architecture }}" "$GITHUB_WORKSPACE/release-files/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files-desktop-flatpak-${{ matrix.architecture }}
          path: release-files/
          if-no-files-found: error
          retention-days: 7
