name: Release server image

# Without a tag, a manual run pushes only :sha-<commit> of the chosen branch.
on:
  push:
    tags: ["server-[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing server-<version> tag to build (empty for :sha-<commit> of the chosen branch)
        required: false
        default: ""

concurrency:
  group: release-server-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SERVER_IMAGE: ghcr.io/tosunlab/hisar-server

jobs:
  server-image:
    name: Build and push the linux/amd64 and linux/arm64 server image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - name: Check the tag
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^server-[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "$TAG is not a server-<version> tag"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Choose image tags
        id: imageTag
        run: |
          commit=$(git rev-parse HEAD)
          shaTag="sha-$(git rev-parse --short=8 HEAD)"
          allImageTag="$SERVER_IMAGE:$shaTag"
          if [ -n "$TAG" ]; then allImageTag="$allImageTag,$SERVER_IMAGE:${TAG#server-}"; fi
          {
            echo "commit=$commit"
            echo "shaTag=$shaTag"
            echo "allImageTag=$allImageTag"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.imageTag.outputs.allImageTag }}
          labels: |
            org.opencontainers.image.source=https://github.com/tosunlab/hisarapp-core
            org.opencontainers.image.revision=${{ steps.imageTag.outputs.commit }}
            org.opencontainers.image.title=hisar-server
      - name: Check that both architectures were pushed
        env:
          SHA_TAG: ${{ steps.imageTag.outputs.shaTag }}
        run: |
          docker buildx imagetools inspect --raw "$SERVER_IMAGE:$SHA_TAG" | tee manifest.json
          grep -q '"architecture": *"amd64"' manifest.json && grep -q '"architecture": *"arm64"' manifest.json
