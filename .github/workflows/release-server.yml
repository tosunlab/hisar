name: Release server image

# Called by the Release workflow with a server-<version> tag: builds and pushes the image as :<version> and :sha-<commit>.
# The Release workflow creates the GitHub prerelease. Running it by hand on a branch pushes only :sha-<commit>.
on:
  workflow_call:
    inputs:
      tag:
        description: The server-<version> tag to build
        type: string
        required: true
    outputs:
      digest:
        description: Immutable multiarchitecture image index
        value: ${{ jobs.server-image.outputs.digest }}
  workflow_dispatch:

concurrency:
  group: release-server-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  SERVER_IMAGE: ghcr.io/tosunlab/hisar-server

jobs:
  ci:
    if: inputs.tag == ''
    uses: ./.github/workflows/ci.yml
    with:
      baseRef: ""

  server-image:
    name: Build and push the linux/amd64 and linux/arm64 server image
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || (inputs.tag != '' && needs.ci.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^server-[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "$TAG is not a server-<version> tag"; exit 1
          fi
      # The commit the run started from (the one the Release run tagged), not the tag, which could be moved during the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Choose image tags and the server version
        id: imageTag
        run: |
          commit=$(git rev-parse HEAD)
          shaTag="sha-$(git rev-parse --short=8 HEAD)"
          allImageTag="$SERVER_IMAGE:$shaTag"
          version="$shaTag"
          if [ -n "$TAG" ]; then
            version="${TAG#server-}"
            allImageTag="$allImageTag,$SERVER_IMAGE:$version"
          fi
          {
            echo "commit=$commit"
            echo "allImageTag=$allImageTag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          tags: ${{ steps.imageTag.outputs.allImageTag }}
          build-args: VERSION=${{ steps.imageTag.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.imageTag.outputs.commit }}
            org.opencontainers.image.title=hisar-server
      - name: Attest the multiarchitecture image index
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.SERVER_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Check that both architectures were pushed
        run: |
          docker buildx imagetools inspect --raw "$SERVER_IMAGE@${{ steps.build.outputs.digest }}" | tee manifest.json
          grep -q '"architecture": *"amd64"' manifest.json && grep -q '"architecture": *"arm64"' manifest.json
