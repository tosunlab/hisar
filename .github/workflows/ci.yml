name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PG_URL: postgres://postgres:hisar@localhost:5432/hisar?sslmode=disable

jobs:
  go:
    name: vet, test, cross-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: gofmt
        run: test -z "$(gofmt -l core server cli)" || (gofmt -l core server cli; exit 1)
      - run: make vet
      - name: Test (database tests must not be skipped)
        run: |
          make test TESTFLAGS=-v 2>&1 | tee test.log
          ! grep -- "--- SKIP" test.log
        env:
          HISAR_TEST_DATABASE_URL: ${{ env.PG_URL }}
      - run: make build
      - name: Cross-compile CLI
        run: make build-cli-all

  smoke:
    name: CLI + server smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: make smoke
        env:
          HISAR_DATABASE_URL: ${{ env.PG_URL }}

  docker:
    name: server Docker image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: make docker
      - name: Run image, check health and invite command
        run: |
          docker run -d --name hisar --network host \
            -e HISAR_DATABASE_URL="$PG_URL" -e HISAR_ADDR=127.0.0.1:8080 \
            hisar-server:dev
          if ! curl -sf --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz; then
            docker logs hisar
            exit 1
          fi
          docker exec hisar hisar-server invite --email ci@example.com --role admin | grep -q "/invite/"
          docker logs hisar
