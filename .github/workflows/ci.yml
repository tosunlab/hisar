name: CI

# A merge to main was already tested as its pull request, so pushes to main do not run CI. The Release workflow calls it
# for the commit it releases, with baseRef the previous release's tag: the jobs that run only for some changes compare the
# commit with it, and without a baseRef everything runs.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      baseRef:
        description: The tag or commit to compare with; empty runs every job
        type: string
        default: ""

# A release's CI runs in its own group, so it never cancels or is cancelled by another run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false
  CRANE_VERSION: v0.20.6

jobs:
  changes:
    name: Check what the pull request changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      isDesktopChanged: ${{ steps.changes.outputs.isDesktopChanged }}
      isAndroidChanged: ${{ steps.changes.outputs.isAndroidChanged }}
      isAdminChanged: ${{ steps.changes.outputs.isAdminChanged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check packaging toolchain pins
        run: bash scripts/check-go-toolchain.sh
      - name: Test release and CI input selection
        run: bash scripts/test-app-paths.sh
      - name: Compare the pull request with its base
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.baseRef }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_FORCED: ${{ github.event_name != 'pull_request' && inputs.baseRef == '' }}
          WORKFLOW_FILE: .github/workflows/ci.yml
        run: scripts/detect-app-changes.sh

  go:
    name: Go gofmt, vet, tests and end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PG_URL: postgres://postgres:hisar@127.0.0.1:5432/hisar?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Set up Node for make build, which builds the admin dashboard
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Check gofmt
        run: |
          allUnformatted=$(git ls-files -z "*.go" | xargs -0 gofmt -l)
          if [ -n "$allUnformatted" ]; then echo "$allUnformatted"; exit 1; fi
      - name: go vet
        run: make vet
      - name: go test with Postgres
        run: |
          set -o pipefail
          HISAR_TEST_DATABASE_URL=$PG_URL make test TESTFLAGS=-v 2>&1 | tee test.log
      # The integration tests need a running server and run in the end-to-end step; TestRecordOpenSSHFixture only runs when asked to.
      - name: Fail on skipped tests outside the allowlist
        run: |
          if grep -- "--- SKIP" test.log | grep -v -E "TestIntegration[A-Za-z]+|TestRecordOpenSSHFixture"; then exit 1; fi
      - name: Build server and CLI
        run: make build
      - name: Build CLI for every release platform
        run: make build-cli-all
      - name: End-to-end test of the built server and CLI
        run: |
          PGPASSWORD=hisar psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE hisar_end_to_end"
          HISAR_DATABASE_URL="postgres://postgres:hisar@127.0.0.1:5432/hisar_end_to_end?sslmode=disable" make test-end-to-end

  server-image-check:
    name: Server Docker image build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
      registry:
        image: registry:2
        ports: ["5000:5000"]
    env:
      CHECK_IMAGE: localhost:5000/hisar-server:check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Install crane
        run: go install "github.com/google/go-containerregistry/cmd/crane@$CRANE_VERSION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - name: Build the linux/amd64 and linux/arm64 image into a throwaway registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ env.CHECK_IMAGE }}
      - name: Check manifest and config
        run: |
          crane manifest --insecure "$CHECK_IMAGE" | tee manifest.json
          grep -q '"architecture":"amd64"' manifest.json && grep -q '"architecture":"arm64"' manifest.json
          crane config --insecure "$CHECK_IMAGE" | tee config.json
          grep -q '"Entrypoint":\["hisar-server"\]' config.json && grep -q '"User":"65532"' config.json
      - name: Boot the image's hisar-server against Postgres
        env:
          HISAR_DATABASE_URL: postgres://postgres:hisar@127.0.0.1:5432/hisar?sslmode=disable
          HISAR_ADDR: 127.0.0.1:8080
        run: |
          export HISAR_SECRETS_FILE=$RUNNER_TEMP/hisar-secrets.json
          mkdir rootfs && crane export --insecure --platform linux/amd64 "$CHECK_IMAGE" - | tar -x -C rootfs
          rootfs/usr/local/bin/hisar-server serve > server.log 2>&1 &
          curl -sf --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/healthz
          rootfs/usr/local/bin/hisar-server migrate status | tee status.log
          if grep -q pending status.log; then exit 1; fi
          rootfs/usr/local/bin/hisar-server invite --email ci@example.com --role admin | grep -q "/invite/"
          curl -sf http://127.0.0.1:8080/admin | grep -q "<title>Hisar admin dashboard</title>"
      - name: Show server log
        if: always()
        run: cat server.log || true

  desktop-frontend:
    name: Desktop frontend typecheck, tests and bundle check
    needs: changes
    if: needs.changes.outputs.isDesktopChanged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: make test-desktop-frontend

  desktop-linux:
    name: Desktop app Linux build
    needs: changes
    if: needs.changes.outputs.isDesktopChanged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: node:24-trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK 4 and WebKitGTK
        run: bash scripts/ci-apt-install.sh libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH" && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make install-wails
      - name: Build the .deb, .rpm and AppImage and check their layout
        shell: bash
        run: |
          bash scripts/package-desktop-linux.sh 0.0.0-ci
          contents=$(dpkg-deb -c desktop/bin/Hisar-0.0.0-ci-linux-amd64.deb)
          for path in ./usr/bin/Hisar ./usr/bin/hisar ./usr/lib/hisar/hisar-browser-host ./usr/share/applications/com.tryhisar.hisar.desktop; do
            grep -q " $path\$" <<<"$contents" || { echo "the .deb has no $path"; exit 1; }
          done
          test -s desktop/bin/Hisar-0.0.0-ci-linux-amd64.rpm
          test -x desktop/bin/Hisar-0.0.0-ci-linux-amd64.AppImage
      - name: Install the .deb, start Hisar hidden and reach it from hisar and ssh-add
        run: bash scripts/test-desktop-linux-package.sh desktop/bin/Hisar-0.0.0-ci-linux-amd64.deb
      - name: Start the AppImage hidden and reach it from the hisar it copies out
        run: bash scripts/test-desktop-linux-package.sh desktop/bin/Hisar-0.0.0-ci-linux-amd64.AppImage
      - name: Check that the generated bindings are committed
        run: git diff --exit-code -- desktop/frontend/bindings

  desktop-flatpak:
    name: Desktop app Flatpak build
    needs: changes
    if: needs.changes.outputs.isDesktopChanged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Flathub's builder image has flatpak-builder, Node and the GNOME 51 runtime and SDK; building sandboxes needs privileges.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the Flatpak and check what it installs
        run: |
          bash scripts/package-desktop-flatpak.sh 0.0.0-ci
          flatpak install --user -y --noninteractive desktop/bin/Hisar-0.0.0-ci-linux-amd64.flatpak
          flatpak run --command=sh com.tryhisar.hisar -c 'test -x /app/bin/Hisar && test -x /app/lib/hisar/hisar-browser-host && /app/bin/hisar --version'

  extension:
    name: Extension tests, Chromium end-to-end tests and zip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install make and zip
        run: bash scripts/ci-apt-install.sh make zip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: make test-extension
      - run: make test-extension-end-to-end
      - run: make build-extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hisar-extension
          path: extension/hisar-extension-*.zip
          retention-days: 14

  raycast:
    name: Raycast extension typecheck, tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raycast/package-lock.json
      - run: make test-raycast

  omp:
    name: omp plugin typecheck, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: make test-omp

  share-link-page:
    name: Share link page in Chromium against the server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install make
        run: bash scripts/ci-apt-install.sh make
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: HISAR_DATABASE_URL="postgres://postgres:hisar@postgres:5432/hisar?sslmode=disable" make test-share-link-page

  admin:
    name: Admin dashboard tests and Chromium end-to-end tests against the server
    needs: changes
    if: needs.changes.outputs.isAdminChanged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install make
        run: bash scripts/ci-apt-install.sh make
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: make test-admin
      - name: Check that admin/src/themes.css matches assets/themes/themes.json
        run: node scripts/themes/generate.ts && git config --global --add safe.directory "$GITHUB_WORKSPACE" && git diff --exit-code -- admin/src/themes.css
      - run: HISAR_DATABASE_URL="postgres://postgres:hisar@postgres:5432/hisar?sslmode=disable" make test-admin-end-to-end

  android:
    name: Android app build, JVM tests and instrumented tests (part ${{ matrix.part }} of 2)
    needs: changes
    # The skip-android label skips both parts, for a pull request whose Android build and tests already passed locally (make
    # build-android-aar build-android test-android test-android-ui); a run reads the labels the pull request has when it starts.
    if: needs.changes.outputs.isAndroidChanged == 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-android')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Each part runs half of the instrumented tests on its own emulator; the first also runs the JVM tests and the second builds
    # the release APK and runs lint, so both take about as long.
    strategy:
      fail-fast: false
      matrix:
        # shard is the test runner's 0-based ANDROID_UI_TEST_SHARD.
        include:
          - part: 1
            shard: 0/2
          - part: 2
            shard: 1/2
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install the pinned Android SDK packages
        run: |
          scripts/install-android-sdk.sh --build-only
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      # HisarKit.aar is built from the Go code alone, so a pull request whose push left that code as it was reuses the one its
      # earlier run built. A pull request can only reuse what it or main saved, so its first run builds it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hisarkit
        with:
          path: mobile/build/HisarKit.aar
          key: hisarkit-android-${{ hashFiles('go.work', 'core/**', 'mobile/go.mod', 'mobile/go.sum', 'mobile/hisarkit/**', 'mobile/build-android-aar.sh', 'scripts/install-android-sdk.sh') }}
      - if: steps.hisarkit.outputs.cache-hit != 'true'
        run: make build-android-aar
      - name: Check that ThemePalettes.kt matches assets/themes/themes.json
        if: matrix.part == 1
        run: node scripts/themes/generate.ts && git diff --exit-code
      - if: matrix.part == 2
        run: make build-android
      - if: matrix.part == 1
        run: make test-android
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an API 36 emulator
        env:
          HISAR_DATABASE_URL: postgres://postgres:hisar@127.0.0.1:5432/hisar?sslmode=disable
          ANDROID_UI_TEST_SHARD: ${{ matrix.shard }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # The x86_64 API 37 image crash-loops on these runners: surfaceflinger aborts on "Assertion failed:
          # !rcEnc->featureInfo()->hasReadColorBufferDma" about every 30 seconds with every GPU mode, so API 37 runs locally.
          api-level: "36"
          target: google_apis
          arch: x86_64
          # The action's default device has a low-memory profile on which the emulator never comes online.
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disk-size: 8192M
          emulator-boot-timeout: 900
          # An app's "isn't responding" dialog takes the window focus from the app under test, and this image's Pixel Launcher
          # sometimes stops responding about 27 seconds after boot; with error dialogs hidden, Android closes such an app
          # instead. The step before built mobile/build/HisarKit.aar, which `make test-android-ui` would build again.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./scripts/test-android-ui.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # A job stopped at its timeout is cancelled rather than failed; its reports explain why.
        if: failure() || cancelled()
        with:
          name: android-reports-${{ matrix.part }}
          path: |
            mobile/android/*/build/reports
            mobile/android/*/build/outputs/androidTest-results
          retention-days: 7
