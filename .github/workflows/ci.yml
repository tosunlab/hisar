name: CI

# Pull requests only: a merge to main was already tested as its pull request.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PG_URL: postgres://postgres:hisar@localhost:5432/hisar?sslmode=disable

jobs:
  go:
    name: "Go: format, vet, tests, builds"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l core server cli mobile desktop/vault desktop/biometric desktop/agent desktop/appinfo desktop/browser desktop/cmd desktop/main.go desktop/touchid.go)" || (gofmt -l core server cli mobile desktop/vault desktop/biometric desktop/agent desktop/appinfo desktop/browser desktop/cmd desktop/main.go desktop/touchid.go; exit 1)
      - name: Vet all modules
        run: make vet
      - name: Run unit and database tests (fails if any test is skipped)
        # TestIntegrationDesktopFlow and TestIntegrationMobileFlow need a running server and run in the end-to-end step.
        run: |
          make test TESTFLAGS=-v 2>&1 | tee test.log
          if grep -- "--- SKIP" test.log | grep -v -E "TestIntegrationDesktopFlow|TestIntegrationMobileFlow"; then exit 1; fi
        env:
          HISAR_TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Build server and CLI
        run: make build
      - name: Cross-compile CLI for Linux, macOS and Windows
        run: make build-cli-all
      - name: End-to-end test
        run: |
          PGPASSWORD=hisar psql -h localhost -U postgres -c "CREATE DATABASE hisar_end_to_end"
          make test-end-to-end
        env:
          HISAR_DATABASE_URL: postgres://postgres:hisar@localhost:5432/hisar_end_to_end?sslmode=disable

  docker:
    name: "Docker: build server image and boot it against Postgres"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: make docker
      - name: Start container and wait for /healthz
        run: |
          docker run -d --name hisar --network host \
            -e HISAR_DATABASE_URL="$PG_URL" -e HISAR_ADDR=127.0.0.1:8080 \
            hisar-server:dev
          if ! curl -sf --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/healthz; then
            docker logs hisar
            exit 1
          fi
      - name: Check migrations are applied and invite command works in the container
        run: |
          docker exec hisar hisar-server migrate status | tee status.log
          ! grep -q pending status.log
          docker exec hisar hisar-server invite --email ci@example.com --role admin | grep -q "/invite/"
      - name: Show container logs
        if: always()
        run: docker logs hisar

  desktop-frontend:
    name: "Desktop frontend: type-check and component tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Type-check and run Vitest
        run: make test-desktop-frontend

  desktop-macos:
    name: "Desktop macOS: build and package Hisar.app"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install the pinned wails3 CLI
        run: make install-wails
      - name: Test Touch ID keychain storage (macOS frameworks)
        run: go -C desktop test -count=1 -v ./biometric/
      - name: Build and package Hisar.app
        run: make package-desktop
      - name: Check the app bundle
        run: |
          test -x desktop/bin/Hisar.app/Contents/MacOS/Hisar
          plutil -extract CFBundleIdentifier raw desktop/bin/Hisar.app/Contents/Info.plist | grep -qx com.tryhisar.hisar
          codesign --verify --deep desktop/bin/Hisar.app
      - name: Fail if the build changed the committed bindings
        run: git diff --exit-code -- desktop/frontend/bindings
      - name: Zip Hisar.app
        run: cd desktop/bin && ditto -c -k --keepParent Hisar.app Hisar-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hisar-macos
          path: desktop/bin/Hisar-macos.zip
          retention-days: 14

  ios:
    name: "iOS: build the framework and app, unit and UI tests in the simulator"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: Install the pinned XcodeGen and PostgreSQL
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          brew install postgresql@17
      - name: Fail if the committed Xcode project differs from project.yml
        run: |
          make generate-ios-project
          git diff --exit-code -- mobile/ios
      - name: Install gomobile and build the framework
        run: make build-ios-framework
      - name: Check the framework slices
        run: |
          test -d mobile/build/HisarKit.xcframework/ios-arm64/HisarKit.framework
          test -d mobile/build/HisarKit.xcframework/ios-arm64_x86_64-simulator/HisarKit.framework
      - name: Build the app with the AutoFill extension, and the free personal team variant, for the simulator
        run: make build-ios
      - name: Run unit tests in the simulator
        run: make test-ios
      - name: Build the server for the UI tests
        run: make build
      - name: Start PostgreSQL and create the UI test database
        run: |
          brew services start postgresql@17
          for attempt in $(seq 30); do "$(brew --prefix postgresql@17)/bin/pg_isready" -h localhost && break; sleep 1; done
          "$(brew --prefix postgresql@17)/bin/createdb" -h localhost hisar_ios
      - name: Run UI tests in the simulator against a local server (sign up, items, lock, sign in, Face ID, AutoFill screens)
        run: HISAR_DATABASE_URL="postgres://$(whoami)@localhost:5432/hisar_ios?sslmode=disable" make test-ios-ui
        env:
          IOS_RESULT_BUNDLE: ${{ runner.temp }}/HisarUITests.xcresult
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-ui-test-results
          path: ${{ runner.temp }}/HisarUITests.xcresult
          retention-days: 7

  desktop-linux:
    name: "Desktop Linux: build the app"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install GTK 4 and WebKitGTK 6.0 development packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install the pinned wails3 CLI
        run: make install-wails
      - name: Build the app
        run: make build-desktop
      - name: Check the binary
        run: test -x desktop/bin/Hisar

  extension:
    name: "Browser extension: type-check, unit tests, end-to-end test in Chromium, build and package"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Type-check and run Vitest
        run: make test-extension
      - name: Install Playwright's Chromium
        run: cd extension && npx playwright install --with-deps chromium
      - name: End-to-end test (unpacked extension, fake native host, local login page)
        run: make test-extension-end-to-end
      - name: Build and zip the extension
        run: make build-extension
      - uses: actions/upload-artifact@v4
        with:
          name: hisar-extension
          path: extension/hisar-extension-*.zip
          retention-days: 14
