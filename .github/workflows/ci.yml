name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PG_URL: postgres://postgres:hisar@localhost:5432/hisar?sslmode=disable

jobs:
  go:
    name: "Go: format, vet, unit and database tests, cross-compile CLI"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l core server cli)" || (gofmt -l core server cli; exit 1)
      - name: Vet all modules
        run: make vet
      - name: Run unit and database tests (fails if any test is skipped)
        run: |
          make test TESTFLAGS=-v 2>&1 | tee test.log
          ! grep -- "--- SKIP" test.log
        env:
          HISAR_TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Build server and CLI
        run: make build
      - name: Cross-compile CLI for Linux, macOS and Windows
        run: make build-cli-all

  end-to-end:
    name: "End-to-end: built server and CLI, two users against Postgres"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: "Sign up, share a vault, edit, delete, log in on a second device"
        run: make test-end-to-end
        env:
          HISAR_DATABASE_URL: ${{ env.PG_URL }}

  docker:
    name: "Docker: build server image and boot it against Postgres"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hisar
          POSTGRES_DB: hisar
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: make docker
      - name: Start container and wait for /healthz
        run: |
          docker run -d --name hisar --network host \
            -e HISAR_DATABASE_URL="$PG_URL" -e HISAR_ADDR=127.0.0.1:8080 \
            hisar-server:dev
          if ! curl -sf --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/healthz; then
            docker logs hisar
            exit 1
          fi
      - name: Check migrations are applied and invite command works in the container
        run: |
          docker exec hisar hisar-server migrate status | tee status.log
          ! grep -q pending status.log
          docker exec hisar hisar-server invite --email ci@example.com --role admin | grep -q "/invite/"
      - name: Show container logs
        if: always()
        run: docker logs hisar
