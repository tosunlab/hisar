name: Release extension

# Called by the Release workflow with an extension-<version> tag: builds hisar-extension-<version>.zip into the artifact
# release-files-extension-zip, which the Release workflow puts on the GitHub prerelease. The version comes from the tag,
# not from the repository: the build writes it into manifest.json and package.json. Chrome only takes numeric versions,
# so a custom build (extension-1.2.3-label) is 1.2.3 inside.
on:
  workflow_call:
    inputs:
      tag:
        description: The extension-<version> tag to build
        type: string
        required: true

permissions:
  contents: read

jobs:
  extension-release-build:
    name: Build the extension zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
      EXTENSION_ID: mmipiffoogblblocokimpemdopmdjghf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build the zip
        run: |
          version=${TAG#extension-}
          manifestVersion=${version%%-*}
          # shellcheck disable=SC2016
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            for (const path of ["extension/public/manifest.json", "extension/package.json"]) {
              const json = JSON.parse(readFileSync(path, "utf8"));
              json.version = process.argv[1];
              writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`);
            }
          ' "$manifestVersion"
          make build-extension
          mkdir extension-release
          cp "extension/hisar-extension-$manifestVersion.zip" "extension-release/hisar-extension-$version.zip"
      # The manifest key fixes the extension ID that the Mac app's native host allows.
      - name: Check the zip keeps the manifest key and has the version
        run: |
          version=${TAG#extension-}
          unzip -p "extension-release/hisar-extension-$version.zip" manifest.json > "$RUNNER_TEMP/manifest.json"
          # shellcheck disable=SC2016
          node -e '
            const { readFileSync } = require("node:fs");
            const { createHash } = require("node:crypto");
            const manifest = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (!manifest.key) { console.error("manifest.json in the zip has no key"); process.exit(1); }
            const id = [...createHash("sha256").update(Buffer.from(manifest.key, "base64")).digest("hex").slice(0, 32)]
              .map((digit) => String.fromCharCode(97 + parseInt(digit, 16))).join("");
            if (id !== process.env.EXTENSION_ID) { console.error(`extension ID ${id} is not ${process.env.EXTENSION_ID}`); process.exit(1); }
            if (manifest.version !== process.argv[2]) { console.error(`manifest.json in the zip has version ${manifest.version}, not ${process.argv[2]}`); process.exit(1); }
            console.log(`extension ID ${id}, version ${manifest.version}`);
          ' "$RUNNER_TEMP/manifest.json" "${version%%-*}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files-extension-zip
          path: extension-release/
          if-no-files-found: error
          retention-days: 7
