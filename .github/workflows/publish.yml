name: Publish

# Publishes a prerelease that the Release workflow created: the last job of each Release run calls it, and it waits in the
# environment publish-<app> until a reviewer approves. Running it by hand publishes an existing prerelease, through the
# same approval. Only plain <app>-MAJOR.MINOR.PATCH tags are published, never custom builds, and never an older version
# than the app's newest published release.
on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      app:
        description: What to publish
        type: choice
        options: [server, cli, desktop, extension, docs]
      tag:
        description: Release tag, e.g. desktop-1.2.3
        required: true

permissions:
  contents: write
  packages: write
  attestations: read

env:
  APP: ${{ inputs.app }}
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish-${{ inputs.app }}
    # A newer release of the app waiting here replaces an older one that is still waiting.
    concurrency:
      group: publish-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      # The default branch, for the release notes script and install texts; the history and tags, for the release notes and
      # the tested release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Check the tag and that it is newer than the published release
        run: |
          [[ "$TAG" =~ ^$APP-[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a plain $APP-MAJOR.MINOR.PATCH tag; custom builds can't be published"; exit 1; }
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::the tag $TAG does not exist"; exit 1; }
          [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease 2>/dev/null)" = true ] ||
            { echo "::error::$TAG has no prerelease to publish (missing or already published); run Release for $APP"; exit 1; }
          version=${TAG#"$APP"-}
          publishedTag=$(gh release list --limit 1000 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' |
            grep -E "^$APP-[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1 || true)
          publishedVersion=${publishedTag#"$APP"-}
          if [ -n "$publishedTag" ] && [ "$(printf '%s\n%s\n' "$version" "$publishedVersion" | sort -V | tail -n 1)" != "$version" ]; then
            echo "::error::$publishedTag is already published; publishing $TAG would go back to an older version"; exit 1
          fi
          {
            echo "VERSION=$version"
            echo "PUBLISHED_TAG=$publishedTag"
            echo "SOURCE_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")"
          } >> "$GITHUB_ENV"

      # The server and the docs site are images: publishing points their version, MAJOR.MINOR and latest tags at the image.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.app == 'server' || inputs.app == 'docs'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.app == 'server' || inputs.app == 'docs'
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      # The verifier comes from the tested release commit, so a later default-branch commit cannot change what is checked.
      - name: Download and verify the exact tested release before publishing
        run: |
          mkdir -p "$RUNNER_TEMP/release-files"
          gh release download "$TAG" --dir "$RUNNER_TEMP/release-files"
          git worktree add --detach "$RUNNER_TEMP/release-source" "$SOURCE_SHA"
          python3 "$RUNNER_TEMP/release-source/scripts/release-evidence.py" verify "$APP" "$TAG" "$SOURCE_SHA" \
            "$RUNNER_TEMP/release-files"
      # The build pushed :X.Y.Z before approval, so publishing points it, :X.Y and :latest at the digest just verified; the
      # verifier checked that the evidence names this app's image.
      - name: Point the version, MAJOR.MINOR and latest image tags at the verified image
        if: inputs.app == 'server' || inputs.app == 'docs'
        run: |
          name=$(jq -r .image.name "$RUNNER_TEMP/release-files/release-evidence.json")
          digest=$(jq -r .image.digest "$RUNNER_TEMP/release-files/release-evidence.json")
          docker buildx imagetools inspect "$name@$digest" >/dev/null
          docker buildx imagetools create -t "$name:$VERSION" -t "$name:${VERSION%.*}" -t "$name:latest" "$name@$digest"
          echo "Published $name@$digest as $VERSION, ${VERSION%.*} and latest"

      # Apps are offered a desktop version only once its release has an asset named update.json.
      - name: Offer the desktop version as an automatic update
        if: inputs.app == 'desktop'
        run: |
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx update.json; then
            assetID=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "update-unpublished.json") | .id')
            test -n "$assetID" || { echo "::error::the release $TAG has no update-unpublished.json; run Release for desktop"; exit 1; }
            gh api -X PATCH "repos/$GH_REPO/releases/assets/$assetID" -f name=update.json >/dev/null
          fi

      # The notes cover every change since the published release, also those of prereleases that were never published.
      - name: Mark the release as published and latest
        run: |
          bash scripts/release-notes.sh "$APP" "$PUBLISHED_TAG" "$TAG" "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --prerelease=false --latest
          echo "Published [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

      # Installed copies of the Firefox add-on update from the manifest's update_url, updates.json on the fixed prerelease
      # extension-firefox-updates, which a maintainer creates once (docs/docs/development/releasing.md). It names this
      # version, with the hash of the .xpi just verified, only now that the release is public.
      - name: Offer the Firefox add-on as an update
        if: inputs.app == 'extension'
        run: |
          xpi="hisar-extension-firefox-$VERSION.xpi"
          hash=$(sha256sum "$RUNNER_TEMP/release-files/$xpi" | cut -d " " -f 1)
          jq -n --arg id extension@tryhisar.com --arg version "$VERSION" --arg hash "sha256:$hash" \
            --arg link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$xpi" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link, update_hash: $hash}]}}}' > "$RUNNER_TEMP/updates.json"
          gh release view extension-firefox-updates > /dev/null 2>&1 ||
            { echo "::error::create the prerelease extension-firefox-updates once; see docs/docs/development/releasing.md"; exit 1; }
          gh release upload extension-firefox-updates "$RUNNER_TEMP/updates.json" --clobber
