name: macOS and iOS

# macOS minutes are expensive, so each job runs only when the pull request changes what it builds: desktop/ and cli/ (the
# Mac app), mobile/ios/, mobile/hisarkit/ and mobile/go.mod (the iPhone app), core/ and go.work (both), or this workflow;
# scripts/detect-app-changes.sh decides.
# The run-macos label, or a manual run, runs both anyway. The skip-ios label skips the iPhone job, for a pull request whose
# iPhone build and tests already passed on a Mac (make build-ios-framework build-ios test-ios test-ios-ui); add it before
# pushing, since a run reads the labels the pull request has when it starts. The Release workflow calls it for a desktop
# release, which builds the Mac app and not the iPhone app.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      alwaysRunIos:
        description: Build and test the iPhone app even when nothing it builds from changed
        type: boolean
        default: false
  workflow_call:

# Adding an unrelated label gets its own group, so it never cancels a running build; a manual or release run is its own.
concurrency:
  group: macos-${{ github.event.pull_request.number || github.run_id }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'run-macos') && github.run_id || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false
  XCODE_PATH: /Applications/Xcode_26.6.app
  XCODEGEN_VERSION: 2.46.0

jobs:
  changes:
    name: Check what the pull request changes
    # Adding another label changes no file, so it runs nothing.
    if: github.event.action != 'labeled' || github.event.label.name == 'run-macos'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      isDesktopChanged: ${{ steps.changes.outputs.isDesktopChanged || steps.manual.outputs.isDesktopChanged }}
      isMobileChanged: ${{ steps.changes.outputs.isMobileChanged || steps.manual.outputs.isMobileChanged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare the pull request with its base
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_FORCED: ${{ contains(github.event.pull_request.labels.*.name, 'run-macos') }}
          WORKFLOW_FILE: .github/workflows/macos.yml
        if: github.event_name == 'pull_request'
        run: scripts/detect-app-changes.sh
      - name: Choose what a manual or release run builds
        id: manual
        if: github.event_name != 'pull_request'
        env:
          ALWAYS_RUN_IOS: ${{ inputs.alwaysRunIos || false }}
        run: |
          echo "isDesktopChanged=true" | tee -a "$GITHUB_OUTPUT"
          echo "isMobileChanged=$ALWAYS_RUN_IOS" | tee -a "$GITHUB_OUTPUT"

  desktop-macos:
    name: Desktop app macOS build, Touch ID and Sparkle tests
    needs: changes
    if: needs.changes.outputs.isDesktopChanged == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH" && xcodebuild -version
      - name: Install Wails
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make install-wails
      - name: Touch ID package tests
        run: go -C desktop test -count=1 -v ./biometric/
      - name: Pasteboard tests
        run: go -C desktop test -count=1 -v ./pasteboard/
      - name: Sparkle updater tests
        run: |
          bash scripts/download-sparkle.sh
          CGO_LDFLAGS="-Wl,-rpath,$GITHUB_WORKSPACE/desktop/build/sparkle" go -C desktop test -count=1 -v -tags sparkle ./updater/
      - run: make package-desktop
      - name: Check the app bundle, Sparkle and signatures
        run: |
          test -x desktop/bin/Hisar.app/Contents/MacOS/Hisar
          plutil -extract CFBundleIdentifier raw desktop/bin/Hisar.app/Contents/Info.plist | grep -qx com.tryhisar.hisar
          test -f desktop/bin/Hisar.app/Contents/Frameworks/Sparkle.framework/Versions/Current/Sparkle
          otool -L desktop/bin/Hisar.app/Contents/MacOS/Hisar | grep -q "@rpath/Sparkle.framework/"
          desktop/bin/Hisar.app/Contents/Helpers/hisar --version | grep -q "^hisar "
          codesign --verify --strict desktop/bin/Hisar.app/Contents/Helpers/hisar
          codesign --verify --deep --strict desktop/bin/Hisar.app
      - name: Check that the generated bindings are committed
        run: git diff --exit-code -- desktop/frontend/bindings
      - run: cd desktop/bin && ditto -c -k --keepParent Hisar.app Hisar-macos.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hisar-macos
          path: desktop/bin/Hisar-macos.zip
          retention-days: 14

  ios:
    name: iPhone app build, unit tests and UI tests against the server (part ${{ matrix.part }} of 2)
    needs: changes
    if: needs.changes.outputs.isMobileChanged == 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-ios')
    runs-on: macos-26
    timeout-minutes: 90
    # Each part runs half of the UI tests (IOS_UI_TEST_PART in scripts/test-ios-ui.sh) on its own simulator; the first also
    # checks the generated project and runs the unit tests.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    env:
      DATABASE_NAME: hisar_ios_${{ github.run_id }}_${{ github.run_attempt }}
      # make build-ios builds the app and the tests once; the test steps run what it built.
      IOS_TESTS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH" && xcodebuild -version
      # Booting takes a minute; it happens while HisarKit and the app build, and the tests then run on it as it is.
      - name: Choose and boot the simulator
        run: |
          IOS_SIMULATOR_ID=$(mobile/ios/scripts/find-simulator.sh)
          echo "IOS_SIMULATOR_ID=$IOS_SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$IOS_SIMULATOR_ID"
      - name: Install XcodeGen
        if: matrix.part == 1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/xcodegen/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: matrix.part == 1
        run: make generate-ios-project
      - name: Check that the generated Xcode project is committed
        if: matrix.part == 1
        run: git diff --exit-code -- mobile/ios
      - run: make build-ios-framework
      - name: Check the HisarKit slices
        run: |
          test -d mobile/build/HisarKit.xcframework/ios-arm64/HisarKit.framework
          test -d mobile/build/HisarKit.xcframework/ios-arm64_x86_64-simulator/HisarKit.framework
      - run: make build-ios
      - if: matrix.part == 1
        run: make test-ios
      - name: Start Postgres
        run: |
          brew list postgresql@17 >/dev/null 2>&1 || brew install postgresql@17
          brew services start postgresql@17
          for _ in $(seq 30); do "$(brew --prefix postgresql@17)/bin/pg_isready" -h localhost && break; sleep 1; done
          "$(brew --prefix postgresql@17)/bin/createdb" -h localhost "$DATABASE_NAME"
      - name: iPhone UI tests
        run: HISAR_DATABASE_URL="postgres://$(whoami)@localhost:5432/$DATABASE_NAME?sslmode=disable" IOS_RESULT_BUNDLE=$GITHUB_WORKSPACE/HisarUITests.xcresult IOS_UI_TEST_PART=${{ matrix.part }} make test-ios-ui
      - name: Drop the test database
        if: always()
        run: '"$(brew --prefix postgresql@17)/bin/dropdb" -h localhost --if-exists "$DATABASE_NAME" || true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: HisarUITests-${{ matrix.part }}.xcresult
          path: HisarUITests.xcresult
          retention-days: 7
