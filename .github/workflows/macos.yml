name: macOS and iOS

# macOS minutes are expensive, so pull requests only run these jobs with the run-macos label.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      alwaysRunIos:
        description: Build and test the iPhone app even when mobile/ did not change
        type: boolean
        default: false

# Adding an unrelated label gets its own group, so it never cancels a running build.
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'run-macos') && github.run_id || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false
  XCODE_PATH: /Applications/Xcode_26.6.app
  XCODEGEN_VERSION: 2.46.0

jobs:
  opt-in:
    name: Check the run-macos opt-in and mobile/ changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-macos') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-macos'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      isMobileChanged: ${{ steps.mobileChange.outputs.isMobileChanged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare mobile/ with main
        id: mobileChange
        env:
          ALWAYS_RUN_IOS: ${{ inputs.alwaysRunIos || false }}
        run: |
          isMobileChanged=false
          if [ "$ALWAYS_RUN_IOS" = true ] || [ -n "$(git diff --name-only origin/main...HEAD -- mobile/)" ]; then isMobileChanged=true; fi
          echo "isMobileChanged=$isMobileChanged" | tee -a "$GITHUB_OUTPUT"

  desktop-macos:
    name: Desktop app macOS build, Touch ID and Sparkle tests
    needs: opt-in
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH" && xcodebuild -version
      - name: Install Wails
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make install-wails
      - name: Touch ID package tests
        run: go -C desktop test -count=1 -v ./biometric/
      - name: Sparkle updater tests
        run: |
          bash scripts/download-sparkle.sh
          CGO_LDFLAGS="-Wl,-rpath,$GITHUB_WORKSPACE/desktop/build/sparkle" go -C desktop test -count=1 -v -tags sparkle ./updater/
      - run: make package-desktop
      - name: Check the app bundle, Sparkle and signatures
        run: |
          test -x desktop/bin/Hisar.app/Contents/MacOS/Hisar
          plutil -extract CFBundleIdentifier raw desktop/bin/Hisar.app/Contents/Info.plist | grep -qx com.tryhisar.hisar
          test -f desktop/bin/Hisar.app/Contents/Frameworks/Sparkle.framework/Versions/Current/Sparkle
          otool -L desktop/bin/Hisar.app/Contents/MacOS/Hisar | grep -q "@rpath/Sparkle.framework/"
          desktop/bin/Hisar.app/Contents/Helpers/hisar --version | grep -q "^hisar "
          codesign --verify --strict desktop/bin/Hisar.app/Contents/Helpers/hisar
          codesign --verify --deep --strict desktop/bin/Hisar.app
      - name: Check that the generated bindings are committed
        run: git diff --exit-code -- desktop/frontend/bindings
      - run: cd desktop/bin && ditto -c -k --keepParent Hisar.app Hisar-macos.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hisar-macos
          path: desktop/bin/Hisar-macos.zip
          retention-days: 14

  ios:
    name: iPhone app build, unit tests and UI tests against the server
    needs: opt-in
    if: needs.opt-in.outputs.isMobileChanged == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DATABASE_NAME: hisar_ios_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH" && xcodebuild -version
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/xcodegen/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make generate-ios-project
      - name: Check that the generated Xcode project is committed
        run: git diff --exit-code -- mobile/ios
      - run: make build-ios-framework
      - name: Check the HisarKit slices
        run: |
          test -d mobile/build/HisarKit.xcframework/ios-arm64/HisarKit.framework
          test -d mobile/build/HisarKit.xcframework/ios-arm64_x86_64-simulator/HisarKit.framework
      - run: make build-ios
      - run: make test-ios
      - run: make build
      - name: Start Postgres
        run: |
          brew list postgresql@17 >/dev/null 2>&1 || brew install postgresql@17
          brew services start postgresql@17
          for _ in $(seq 30); do "$(brew --prefix postgresql@17)/bin/pg_isready" -h localhost && break; sleep 1; done
          "$(brew --prefix postgresql@17)/bin/createdb" -h localhost "$DATABASE_NAME"
      - name: iPhone UI tests
        run: HISAR_DATABASE_URL="postgres://$(whoami)@localhost:5432/$DATABASE_NAME?sslmode=disable" IOS_RESULT_BUNDLE=$GITHUB_WORKSPACE/HisarUITests.xcresult make test-ios-ui
      - name: Drop the test database
        if: always()
        run: '"$(brew --prefix postgresql@17)/bin/dropdb" -h localhost --if-exists "$DATABASE_NAME" || true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: HisarUITests.xcresult
          path: HisarUITests.xcresult
          retention-days: 7
