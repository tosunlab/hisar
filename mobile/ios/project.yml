name: Hisar
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Configuration/Hisar.xcconfig
  Release: Configuration/Hisar.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    GENERATE_INFOPLIST_FILE: false
    DEAD_CODE_STRIPPING: true

targetTemplates:
  HisarApplication:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - framework: ../build/HisarKit.xcframework
        embed: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Info.plist
        OTHER_LDFLAGS: ["-lresolv"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hisar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSFaceIDUsageDescription: Hisar uses Face ID to unlock your vaults.
        NSCameraUsageDescription: Hisar uses the camera to scan the QR code on your Emergency Kit.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.tryhisar.hisar.sign-in
            CFBundleURLSchemes: [hisar]
        HisarAppGroupIdentifier: $(HISAR_APP_GROUP_IDENTIFIER)
        HisarKeychainAccessGroup: $(HISAR_KEYCHAIN_ACCESS_GROUP)

targets:
  Hisar:
    templates: [HisarApplication]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HISAR_APP_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: Configuration/Hisar.entitlements
    entitlements:
      path: Configuration/Hisar.entitlements
      properties:
        com.apple.security.application-groups: [$(HISAR_APP_GROUP_IDENTIFIER)]
        keychain-access-groups: [$(HISAR_KEYCHAIN_ACCESS_GROUP)]
    dependencies:
      - target: HisarAutoFill

  # For a free Apple ID (personal team): no AutoFill extension, app group or shared keychain group.
  HisarPersonal:
    templates: [HisarApplication]
    settings:
      base:
        PRODUCT_NAME: HisarPersonal
        PRODUCT_BUNDLE_IDENTIFIER: $(HISAR_PERSONAL_BUNDLE_IDENTIFIER)
        HISAR_APP_GROUP_IDENTIFIER: ""
        HISAR_KEYCHAIN_ACCESS_GROUP: ""

  HisarAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - AutoFill
      - Shared
    dependencies:
      - framework: ../build/HisarKit.xcframework
        embed: false
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HISAR_AUTOFILL_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: Configuration/HisarAutoFill.entitlements
        INFOPLIST_FILE: AutoFill/Info.plist
        OTHER_LDFLAGS: ["-lresolv"]
        APPLICATION_EXTENSION_API_ONLY: true
    entitlements:
      path: Configuration/HisarAutoFill.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [$(HISAR_APP_GROUP_IDENTIFIER)]
        keychain-access-groups: [$(HISAR_KEYCHAIN_ACCESS_GROUP)]
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: Hisar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Hisar uses Face ID to unlock your vaults.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        HisarAppGroupIdentifier: $(HISAR_APP_GROUP_IDENTIFIER)
        HisarKeychainAccessGroup: $(HISAR_KEYCHAIN_ACCESS_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: false
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true

  HisarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: Hisar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HISAR_BUNDLE_IDENTIFIER_PREFIX).tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Hisar.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hisar
        BUNDLE_LOADER: $(TEST_HOST)

  HisarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: Hisar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HISAR_BUNDLE_IDENTIFIER_PREFIX).ui-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Hisar

schemes:
  Hisar:
    build:
      targets:
        Hisar: all
        HisarAutoFill: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HisarTests
        - HisarUITests
    archive:
      config: Release
  HisarUnitTests:
    build:
      targets:
        Hisar: all
    test:
      config: Debug
      targets:
        - HisarTests
  Hisar Personal Team:
    build:
      targets:
        HisarPersonal: all
    run:
      config: Debug
    archive:
      config: Release
