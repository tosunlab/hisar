name: Hisar
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Configuration/Hisar.xcconfig
  Release: Configuration/Hisar.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    GENERATE_INFOPLIST_FILE: false
    DEAD_CODE_STRIPPING: true

targetTemplates:
  # The team is an individual developer account, so other members cannot get its certificates through automatic signing:
  # Hisar and its extension sign manually with the team's profiles, named after the target ("Hisar Development",
  # "HisarAutoFill App Store"). Simulator builds sign to run locally, with no certificate or profile, as on CI.
  TeamSigning:
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        PROVISIONING_PROFILE_SPECIFIER: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: ${target_name} Development
        Release:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: ${target_name} App Store

  # iPhone only; XcodeGen's iOS target preset would otherwise add iPad, which App Store Connect rejects without every orientation.
  IPhoneOnly:
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"

  HisarApplication:
    templates: [IPhoneOnly]
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - framework: ../build/HisarKit.xcframework
        embed: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Info.plist
        OTHER_LDFLAGS: ["-lresolv"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hisar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSFaceIDUsageDescription: Hisar uses Face ID to unlock your vaults.
        NSCameraUsageDescription: Hisar uses the camera to scan the QR code on your Emergency Kit.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.tryhisar.hisar.sign-in
            CFBundleURLSchemes: [hisar]
        HisarAppGroupIdentifier: $(HISAR_APP_GROUP_IDENTIFIER)
        HisarKeychainAccessGroup: $(HISAR_KEYCHAIN_ACCESS_GROUP)
        # The SDK's ASCredentialExchangeActivity is "ASCredentialExchangeActivity"; Apple's documentation names
        # "ASCredentialExchangeActivityType", so both are listed.
        NSUserActivityTypes: [ASCredentialExchangeActivity, ASCredentialExchangeActivityType]

targets:
  Hisar:
    templates: [HisarApplication, TeamSigning]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HISAR_APP_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: Configuration/Hisar.entitlements
    entitlements:
      path: Configuration/Hisar.entitlements
      properties:
        # App Store Connect requires the extension's entitlement on the app that contains it too.
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [$(HISAR_APP_GROUP_IDENTIFIER)]
        keychain-access-groups: [$(HISAR_KEYCHAIN_ACCESS_GROUP)]
        # Push notifications; exporting for the App Store takes "production" from the distribution profile.
        aps-environment: development
        # Time-sensitive approval pushes break through Focus; the release profile must carry this capability. The
        # personal-team variant (HisarPersonal) signs with no entitlements file, so it does not claim it.
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - target: HisarAutoFill
      - target: HisarNotificationService

  # For a free Apple ID (personal team): no AutoFill extension, app group or shared keychain group.
  HisarPersonal:
    templates: [HisarApplication]
    settings:
      base:
        PRODUCT_NAME: HisarPersonal
        PRODUCT_BUNDLE_IDENTIFIER: $(HISAR_PERSONAL_BUNDLE_IDENTIFIER)
        HISAR_APP_GROUP_IDENTIFIER: ""
        HISAR_KEYCHAIN_ACCESS_GROUP: ""

  HisarAutoFill:
    templates: [IPhoneOnly, TeamSigning]
    type: app-extension
    platform: iOS
    sources:
      - AutoFill
      - Shared
    dependencies:
      - framework: ../build/HisarKit.xcframework
        embed: false
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HISAR_AUTOFILL_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: Configuration/HisarAutoFill.entitlements
        INFOPLIST_FILE: AutoFill/Info.plist
        OTHER_LDFLAGS: ["-lresolv"]
        APPLICATION_EXTENSION_API_ONLY: true
    entitlements:
      path: Configuration/HisarAutoFill.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [$(HISAR_APP_GROUP_IDENTIFIER)]
        keychain-access-groups: [$(HISAR_KEYCHAIN_ACCESS_GROUP)]
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: Hisar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Hisar uses Face ID to unlock your vaults.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        HisarAppGroupIdentifier: $(HISAR_APP_GROUP_IDENTIFIER)
        HisarKeychainAccessGroup: $(HISAR_KEYCHAIN_ACCESS_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: false
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
              SupportsCredentialExchange: true
              SupportedCredentialExchangeVersions: ["1.0"]

  # The Notification Service Extension decrypts a sharing push's details, encrypted to a key only this phone holds, and
  # sets the alert body. It imports no HisarKit: only the shared push files and the configuration reader.
  HisarNotificationService:
    templates: [IPhoneOnly, TeamSigning]
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - Shared/Push
      # PhoneApproval builds an approval push's title and body; it needs only Foundation, so the extension shares it.
      - path: Shared/Backend/PhoneApproval.swift
      - path: Shared/Platform/HisarConfiguration.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HISAR_NOTIFICATION_SERVICE_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: Configuration/HisarNotificationService.entitlements
        INFOPLIST_FILE: NotificationService/Info.plist
        APPLICATION_EXTENSION_API_ONLY: true
    entitlements:
      path: Configuration/HisarNotificationService.entitlements
      properties:
        com.apple.security.application-groups: [$(HISAR_APP_GROUP_IDENTIFIER)]
        keychain-access-groups: [$(HISAR_KEYCHAIN_ACCESS_GROUP)]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Hisar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HisarAppGroupIdentifier: $(HISAR_APP_GROUP_IDENTIFIER)
        HisarKeychainAccessGroup: $(HISAR_KEYCHAIN_ACCESS_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  HisarTests:
    templates: [IPhoneOnly]
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: Hisar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HISAR_BUNDLE_IDENTIFIER_PREFIX).tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Hisar.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hisar
        BUNDLE_LOADER: $(TEST_HOST)

  HisarUITests:
    templates: [IPhoneOnly]
    type: bundle.ui-testing
    platform: iOS
    # CardInput is the editor's card formatter: typing waits for exactly what the editor shows.
    sources: [Tests/UI, Shared/Backend/CardInput.swift]
    dependencies:
      - target: Hisar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HISAR_BUNDLE_IDENTIFIER_PREFIX).ui-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Hisar

schemes:
  Hisar:
    build:
      targets:
        Hisar: all
        HisarAutoFill: all
        HisarNotificationService: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HisarTests
        - HisarUITests
    archive:
      config: Release
  HisarUnitTests:
    build:
      targets:
        Hisar: all
    test:
      config: Debug
      targets:
        - HisarTests
  Hisar Personal Team:
    build:
      targets:
        HisarPersonal: all
    run:
      config: Debug
    archive:
      config: Release
