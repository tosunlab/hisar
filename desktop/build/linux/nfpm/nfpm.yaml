# The Hisar .deb and .rpm (scripts/package-desktop-linux.sh). nfpm expands ${VERSION} and ${GOARCH} from the environment.
# The paths are fixed: desktop/helpers_linux.go reads the browser host and hisar from them, hisar starts /usr/bin/Hisar,
# desktop/harness finds the omp plugin in /usr/share/hisar/omp-plugin and its bin/run-hisar runs /usr/bin/hisar.

name: "hisar"
arch: ${GOARCH}
platform: "linux"
version: ${VERSION}
version_schema: semver
release: "1"
section: "utils"
priority: "optional"
maintainer: "Hisar <support@tryhisar.com>"
description: "End-to-end encrypted password, SSH key and secrets manager for developers"
vendor: "Hisar"
homepage: "https://tryhisar.com"

contents:
  - src: "./bin/Hisar"
    dst: "/usr/bin/Hisar"
    file_info:
      mode: 0755
  - src: "./bin/hisar-browser-host"
    dst: "/usr/lib/hisar/hisar-browser-host"
    file_info:
      mode: 0755
  - src: "./bin/hisar"
    dst: "/usr/bin/hisar"
    file_info:
      mode: 0755
  # The omp plugin, staged in bin/omp-plugin by scripts/stage-omp-plugin.sh; the tree keeps bin/run-hisar executable.
  - src: "./bin/omp-plugin"
    dst: "/usr/share/hisar/omp-plugin"
    type: tree
  - src: "./build/appicon.png"
    dst: "/usr/share/pixmaps/com.tryhisar.hisar.png"
  - src: "./build/linux/com.tryhisar.hisar.desktop"
    dst: "/usr/share/applications/com.tryhisar.hisar.desktop"

# GTK 4 and WebKitGTK 6.0: Ubuntu 24.04+, Debian 13+, Fedora 40+.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"
