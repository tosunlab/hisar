{{define "head"}}<!doctype html>
<meta charset="utf-8">
<style>
body { font: 16px -apple-system, sans-serif; margin: 24px; }
label { display: block; margin: 8px 0; }
input { display: block; font-size: 16px; margin-top: 4px; }
.digits input { display: inline-block; width: 1.4em; text-align: center; }
.fake-input { border: 1px solid #888; width: 12em; height: 1.4em; }
.cover { position: relative; }
.cover input { position: absolute; top: 0; left: 0; opacity: 0; }
</style>
{{if .IsSteered}}<script>
if (window.top === window) {
  setInterval(async () => {
    try {
      const steering = await (await fetch("/steer", { cache: "no-store" })).json();
      if (steering.id > {{.SteeringID}}) location.href = steering.url;
    } catch {}
  }, 200);
}
</script>{{end}}{{end}}
