{{template "head" .}}<title>Create an account</title>
<h1>Create an account</h1>
<form method="post" action="/submit/signup">
<label>Email <input type="email" name="username" id="email" autocomplete="username"></label>
<label>Password <input type="password" name="password" id="password" autocomplete="new-password"></label>
<label>Confirm password <input type="password" name="confirm" id="confirm" autocomplete="new-password"></label>
<button type="submit">Create account</button>
</form>
