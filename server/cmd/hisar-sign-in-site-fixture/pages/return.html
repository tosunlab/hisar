{{template "head" .}}<title>Sign in with Return</title>
<h1>Sign in</h1>
<form method="post" action="/submit/return" id="form">
<label>Username <input type="text" name="username" id="username" autocomplete="username"></label>
<label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
<p>Press Return to sign in.</p>
</form>
<script>
document.getElementById("form").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    event.currentTarget.submit();
  }
});
</script>
