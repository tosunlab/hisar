# Merge requests, release tags and manual runs only: a merge to main was already tested as its merge request.
# server-<version> tags publish the server image, cli-<version> the standalone CLI and desktop-<version> the macOS app (GitLab releases).
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^server-\d+\.\d+\.\d+/
    - if: $CI_COMMIT_TAG =~ /^cli-\d+\.\d+\.\d+/
    - if: $CI_COMMIT_TAG =~ /^desktop-\d+\.\d+\.\d+/
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

stages: [test, build, release, publish]

default:
  interruptible: true

variables:
  GO_VERSION: "1.26.0"
  GOPATH: $CI_PROJECT_DIR/.go
  # -modcacherw: shell runners reuse the build folder, and a read-only module cache stops GitLab from cleaning it.
  GOFLAGS: -buildvcs=false -modcacherw
  npm_config_cache: $CI_PROJECT_DIR/.npm
  POSTGRES_PASSWORD: hisar
  POSTGRES_DB: hisar
  PG_URL: postgres://postgres:hisar@postgres:5432/hisar?sslmode=disable
  CRANE_VERSION: v0.20.6
  REGISTRY: reg.tryhisar.com
  SERVER_IMAGE: reg.tryhisar.com/hisar/core/hisar-server

.merge-request-or-manual:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

.go-cache:
  cache:
    key:
      files: [go.work.sum]
      prefix: go
    paths: [.go/pkg/mod]

.npm-cache:
  cache:
    key:
      files: [desktop/frontend/package-lock.json, extension/package-lock.json]
      prefix: npm
    paths: [.npm]

# The runners are unprivileged, so images are assembled with crane (scripts/build-server-image.sh) instead of Docker.
.crane:
  image: golang:1.26
  extends: .go-cache
  before_script:
    - go install github.com/google/go-containerregistry/cmd/crane@$CRANE_VERSION
    - export PATH=$GOPATH/bin:$PATH

# The only large runner: the longest job and the pipeline's critical path.
go:
  stage: test
  extends: [.merge-request-or-manual, .go-cache]
  tags: [large]
  image: golang:1.26
  services:
    - postgres:18
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null
  script:
    - |
      allUnformatted=$(gofmt -l core server cli mobile desktop/vault desktop/biometric desktop/background desktop/agent desktop/appinfo desktop/browser desktop/commandline desktop/passkey desktop/updater desktop/cmd desktop/main.go desktop/touchid.go desktop/tray.go)
      if [ -n "$allUnformatted" ]; then echo "$allUnformatted"; exit 1; fi
    - make vet
    # The integration tests need a running server and run in the end-to-end step; TestRecordOpenSSHFixture only runs when asked to.
    - set -o pipefail; HISAR_TEST_DATABASE_URL=$PG_URL make test TESTFLAGS=-v 2>&1 | tee test.log
    - if grep -- "--- SKIP" test.log | grep -v -E "TestIntegrationDesktopFlow|TestIntegrationCommandLineThroughApp|TestIntegrationAgentThroughApp|TestIntegrationMobileFlow|TestIntegrationPhoneApproval|TestRecordOpenSSHFixture"; then exit 1; fi
    - make build
    - make build-cli-all
    - PGPASSWORD=hisar psql -h postgres -U postgres -c "CREATE DATABASE hisar_end_to_end"
    - HISAR_DATABASE_URL="postgres://postgres:hisar@postgres:5432/hisar_end_to_end?sslmode=disable" make test-end-to-end

server-image-check:
  stage: test
  extends: [.merge-request-or-manual, .crane]
  services:
    - postgres:18
    - name: registry:2
      alias: registry
  script:
    - CRANE_INSECURE=1 bash scripts/build-server-image.sh registry:5000/hisar-server check
    - crane manifest --insecure registry:5000/hisar-server:check | tee manifest.json
    - grep -q '"architecture":"amd64"' manifest.json && grep -q '"architecture":"arm64"' manifest.json
    - crane config --insecure registry:5000/hisar-server:check | tee config.json
    - grep -q '"Entrypoint":\["hisar-server"\]' config.json && grep -q '"User":"65532"' config.json
    - mkdir rootfs && crane export --insecure --platform linux/amd64 registry:5000/hisar-server:check - | tar -x -C rootfs
    - export HISAR_DATABASE_URL=$PG_URL HISAR_ADDR=127.0.0.1:8080 HISAR_SECRETS_FILE=$CI_PROJECT_DIR/hisar-secrets.json
    - rootfs/usr/local/bin/hisar-server serve > server.log 2>&1 &
    - curl -sf --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/healthz
    - rootfs/usr/local/bin/hisar-server migrate status | tee status.log
    - "! grep -q pending status.log"
    - rootfs/usr/local/bin/hisar-server invite --email ci@example.com --role admin | grep -q "/invite/"
  after_script:
    - cat server.log || true

desktop-frontend:
  stage: test
  extends: [.merge-request-or-manual, .npm-cache]
  image: node:24
  script:
    - make test-desktop-frontend

desktop-linux:
  stage: build
  extends: [.merge-request-or-manual, .go-cache, .npm-cache]
  needs: []
  image: node:24-trixie
  before_script:
    - apt-get update -qq && apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev >/dev/null
    - curl -fsSL "https://go.dev/dl/go$GO_VERSION.linux-amd64.tar.gz" | tar -C /usr/local -xz
    - export PATH=/usr/local/go/bin:$GOPATH/bin:$PATH
  script:
    - make install-wails
    - make build-desktop
    - test -x desktop/bin/Hisar
    - git diff --exit-code -- desktop/frontend/bindings

extension:
  stage: test
  extends: [.merge-request-or-manual, .npm-cache]
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  before_script:
    - apt-get update -qq && apt-get install -y -qq make zip >/dev/null
  script:
    - make test-extension
    - make test-extension-end-to-end
    - make build-extension
  artifacts:
    name: hisar-extension
    paths: [extension/hisar-extension-*.zip]
    expire_in: 14 days

# The share link recipient page in Chromium against the real server and links made by the Go client.
share-link-page:
  stage: test
  extends: [.merge-request-or-manual, .go-cache, .npm-cache]
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  services:
    - postgres:18
  before_script:
    - apt-get update -qq && apt-get install -y -qq make curl >/dev/null
    - curl -fsSL "https://go.dev/dl/go$GO_VERSION.linux-amd64.tar.gz" | tar -C /usr/local -xz
    - export PATH=/usr/local/go/bin:$GOPATH/bin:$PATH
  script:
    - HISAR_DATABASE_URL=$PG_URL make test-share-link-page

# macOS jobs need a runner tagged macos (shell executor with Xcode, Go and Node); set MACOS_RUNNER=true once one exists.
.macos:
  tags: [macos]
  extends: [.go-cache, .npm-cache]
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    # The runner service has no login shell, so Node installed with nvm is not on its PATH.
    - if ! command -v npm >/dev/null && [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh" && nvm use --silent default; fi
    - command -v npm >/dev/null || { echo "Node is not on the runner's PATH; install it with Homebrew or nvm"; exit 1; }
    - export PATH=$GOPATH/bin:$PATH

desktop-macos:
  stage: build
  extends: .macos
  needs: []
  rules:
    - if: $MACOS_RUNNER != "true"
      when: never
    - !reference [.merge-request-or-manual, rules]
  script:
    - make install-wails
    - go -C desktop test -count=1 -v ./biometric/
    - bash scripts/download-sparkle.sh
    - CGO_LDFLAGS="-Wl,-rpath,$CI_PROJECT_DIR/desktop/build/sparkle" go -C desktop test -count=1 -v -tags sparkle ./updater/
    - make package-desktop
    - test -x desktop/bin/Hisar.app/Contents/MacOS/Hisar
    - plutil -extract CFBundleIdentifier raw desktop/bin/Hisar.app/Contents/Info.plist | grep -qx com.tryhisar.hisar
    - test -f desktop/bin/Hisar.app/Contents/Frameworks/Sparkle.framework/Versions/Current/Sparkle
    - otool -L desktop/bin/Hisar.app/Contents/MacOS/Hisar | grep -q "@rpath/Sparkle.framework/"
    - desktop/bin/Hisar.app/Contents/Helpers/hisar --version | grep -q "^hisar "
    - codesign --verify --strict desktop/bin/Hisar.app/Contents/Helpers/hisar
    - codesign --verify --deep --strict desktop/bin/Hisar.app
    - git diff --exit-code -- desktop/frontend/bindings
    - cd desktop/bin && ditto -c -k --keepParent Hisar.app Hisar-macos.zip
  artifacts:
    name: Hisar-macos
    paths: [desktop/bin/Hisar-macos.zip]
    expire_in: 14 days

# iOS is the slowest job, so merge requests only run it when mobile/ changes.
ios:
  stage: build
  extends: .macos
  needs: []
  rules:
    - if: $MACOS_RUNNER != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: [mobile/**/*]
        compare_to: refs/heads/main
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
  script:
    - curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
    - unzip -q -o xcodegen.zip -d .tools && export PATH=$CI_PROJECT_DIR/.tools/xcodegen/bin:$PATH
    - make generate-ios-project
    - git diff --exit-code -- mobile/ios
    - make build-ios-framework
    - test -d mobile/build/HisarKit.xcframework/ios-arm64/HisarKit.framework
    - test -d mobile/build/HisarKit.xcframework/ios-arm64_x86_64-simulator/HisarKit.framework
    - make build-ios
    - make test-ios
    - make build
    - brew list postgresql@17 >/dev/null 2>&1 || brew install postgresql@17
    - brew services start postgresql@17
    - for attempt in $(seq 30); do "$(brew --prefix postgresql@17)/bin/pg_isready" -h localhost && break; sleep 1; done
    - databaseName="hisar_ios_$CI_JOB_ID"
    - '"$(brew --prefix postgresql@17)/bin/createdb" -h localhost "$databaseName"'
    - HISAR_DATABASE_URL="postgres://$(whoami)@localhost:5432/$databaseName?sslmode=disable" IOS_RESULT_BUNDLE=$CI_PROJECT_DIR/HisarUITests.xcresult make test-ios-ui
  after_script:
    - '"$(brew --prefix postgresql@17)/bin/dropdb" -h localhost --if-exists "hisar_ios_$CI_JOB_ID" || true'
  artifacts:
    when: on_failure
    paths: [HisarUITests.xcresult]
    expire_in: 7 days

# Pushes to reg.tryhisar.com with the REGISTRY_USERNAME and REGISTRY_PASSWORD CI/CD variables.
server-image:
  stage: release
  extends: .crane
  rules:
    - if: $CI_COMMIT_TAG =~ /^server-\d+\.\d+\.\d+/
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
  interruptible: false
  script:
    - test -n "$REGISTRY_USERNAME" && test -n "$REGISTRY_PASSWORD" || { echo "set REGISTRY_USERNAME and REGISTRY_PASSWORD in Settings → CI/CD → Variables"; exit 1; }
    - echo "$REGISTRY_PASSWORD" | crane auth login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
    - |
      allTag=("sha-$CI_COMMIT_SHORT_SHA")
      if [ -n "$CI_COMMIT_TAG" ]; then
        allTag+=("${CI_COMMIT_TAG#server-}")
      fi
      bash scripts/build-server-image.sh "$SERVER_IMAGE" "${allTag[@]}"
    - crane manifest "$SERVER_IMAGE:sha-$CI_COMMIT_SHORT_SHA" | tee manifest.json
    - grep -q '"architecture":"amd64"' manifest.json && grep -q '"architecture":"arm64"' manifest.json

# Publishing a server version points the latest and <major>.<minor> image tags at it.
server-publish:
  stage: publish
  extends: .crane
  needs: [server-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^server-\d+\.\d+\.\d+$/
      when: manual
  interruptible: false
  script:
    - echo "$REGISTRY_PASSWORD" | crane auth login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
    - version=${CI_COMMIT_TAG#server-}
    - crane tag "$SERVER_IMAGE:$version" "${version%.*}"
    - crane tag "$SERVER_IMAGE:$version" latest
    - echo "Published $SERVER_IMAGE:$version as latest and ${version%.*}"

# desktop-<version> tags: a universal Hisar.app in a DMG, uploaded to the generic package hisar-desktop/<version>, and a GitLab
# release with the DMG for the team. For release versions the job also signs the Sparkle update (zip and update.json) with the
# protected File variable SPARKLE_PRIVATE_KEY; update.json waits for desktop-publish, because servers only offer versions that have it.
# A custom build (desktop-1.2.3-label) is only the DMG and can't be published.
desktop-dmg:
  stage: build
  extends: .macos
  rules:
    - if: $CI_COMMIT_TAG =~ /^desktop-\d+\.\d+\.\d+/
  interruptible: false
  script:
    - version=${CI_COMMIT_TAG#desktop-}
    - bash scripts/get-build-number.sh "$version"
    - case "$version" in *-*) isCustomBuild=true ;; *) isCustomBuild=false ;; esac
    - $isCustomBuild || test -s "${SPARKLE_PRIVATE_KEY:-}" || { echo "set the protected File variable SPARKLE_PRIVATE_KEY (Sparkle's EdDSA private key) in Settings → CI/CD → Variables"; exit 1; }
    - python3 -m venv .dmgbuild && .dmgbuild/bin/pip install -q dmgbuild==1.6.5 && export PATH=$CI_PROJECT_DIR/.dmgbuild/bin:$PATH
    - make install-wails
    - bash scripts/package-desktop-dmg.sh "$version"
    - packageBaseUrl="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hisar-desktop/$version"
    - allFileName=("Hisar-$version.dmg")
    - |
      if $isCustomBuild; then
        releaseName="Hisar for macOS $version (custom build)"
        releaseDescription="Custom build $version for testing. It is never offered as an automatic update; the next release updates it."
      else
        # The tag's annotation is the release notes; a lightweight tag gets "Hisar <version>".
        printf '%s\n' "${CI_COMMIT_TAG_MESSAGE:-}" > release-notes.md
        bash scripts/package-desktop-update.sh "$version" "$SPARKLE_PRIVATE_KEY" release-notes.md
        allFileName+=("Hisar-$version.zip")
        releaseName="Hisar for macOS $version"
        releaseDescription="Universal (Apple silicon and Intel) build of Hisar $version. Run desktop-publish in the tag's pipeline to offer it as an automatic update."
      fi
      for fileName in "${allFileName[@]}"; do
        curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "desktop/bin/$fileName" "$packageBaseUrl/$fileName"
      done
      printf 'DESKTOP_VERSION=%s\nDESKTOP_PACKAGE_URL=%s\nDESKTOP_RELEASE_NAME=%s\nDESKTOP_RELEASE_DESCRIPTION=%s\n' \
        "$version" "$packageBaseUrl/Hisar-$version.dmg" "$releaseName" "$releaseDescription Open the DMG and drag Hisar into Applications. The app is not notarized yet: on first launch, right-click Hisar → Open." > desktop-release.env
  artifacts:
    paths: [desktop/bin/update.json]
    reports:
      dotenv: desktop-release.env

desktop-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [desktop-dmg]
  rules:
    - if: $CI_COMMIT_TAG =~ /^desktop-\d+\.\d+\.\d+/
  interruptible: false
  script:
    - echo "Releasing Hisar for macOS $DESKTOP_VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $DESKTOP_RELEASE_NAME
    description: $DESKTOP_RELEASE_DESCRIPTION
    assets:
      links:
        - name: Hisar-$DESKTOP_VERSION.dmg
          url: $DESKTOP_PACKAGE_URL
          link_type: package
          filepath: /Hisar.dmg

# Publishing a desktop version uploads its update.json, after which servers offer it to every app as an automatic update.
desktop-publish:
  stage: publish
  image: alpine:3.22
  needs: [desktop-dmg, desktop-release]
  rules:
    - if: $CI_COMMIT_TAG =~ /^desktop-\d+\.\d+\.\d+$/
      when: manual
  interruptible: false
  script:
    - apk add --no-cache curl >/dev/null
    - test -s desktop/bin/update.json
    - 'curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file desktop/bin/update.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hisar-desktop/$DESKTOP_VERSION/update.json"'
    - echo "Published Hisar for macOS $DESKTOP_VERSION as an automatic update"

# cli-<version> tags: the standalone hisar for Linux, macOS and Windows (scripts/package-cli-release.sh) in the generic package
# hisar-cli/<version>; SHA256SUMS goes on to cli-publish, which reads the file names from it.
cli-release-build:
  stage: build
  extends: .go-cache
  image: golang:1.26
  rules:
    - if: $CI_COMMIT_TAG =~ /^cli-\d+\.\d+\.\d+/
  interruptible: false
  before_script:
    - apt-get update -qq && apt-get install -y -qq zip >/dev/null
  script:
    - version=${CI_COMMIT_TAG#cli-}
    - bash scripts/package-cli-release.sh "$version" cli-release
    - tar -xzf "cli-release/hisar-$version-linux-amd64.tar.gz" -C /tmp hisar && test "$(/tmp/hisar --version)" = "hisar $version"
    - packageBaseUrl="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hisar-cli/$version"
    # SHA256SUMS goes last, so a complete package is one that has it.
    - |
      for fileName in $(cd cli-release && ls hisar-"$version"-*) SHA256SUMS; do
        curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "cli-release/$fileName" "$packageBaseUrl/$fileName"
      done
    - printf 'CLI_VERSION=%s\nCLI_PACKAGE_URL=%s\n' "$version" "$packageBaseUrl" > cli-release.env
  artifacts:
    paths: [cli-release/SHA256SUMS]
    reports:
      dotenv: cli-release.env

# Publishing a CLI version creates the GitLab release of its cli-<version> tag with a link to every archive, or updates it
# when it already exists (a retried job). A custom build (cli-1.2.3-label) can't be published.
cli-publish:
  stage: publish
  image: alpine:3.22
  needs: [cli-release-build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^cli-\d+\.\d+\.\d+$/
      when: manual
  interruptible: false
  script:
    - apk add --no-cache curl >/dev/null
    - releaseUrl="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
    - name="Hisar command-line tool $CLI_VERSION"
    - description="The standalone hisar command-line tool for Linux, macOS and Windows. Download the archive for your platform and SHA256SUMS, check it with sha256sum -c --ignore-missing SHA256SUMS (shasum -a 256 -c on macOS), and put hisar on your PATH. With the Hisar app on a Mac, install hisar from Settings → Command-line tool instead."
    - |
      allLink=""
      for fileName in $(awk '{print $2}' cli-release/SHA256SUMS) SHA256SUMS; do
        link="{\"name\":\"$fileName\",\"url\":\"$CLI_PACKAGE_URL/$fileName\",\"link_type\":\"package\",\"direct_asset_path\":\"/$fileName\"}"
        allLink="${allLink:+$allLink,}$link"
      done
      status=$(curl -sS -o /dev/null -w '%{http_code}' --header "JOB-TOKEN: $CI_JOB_TOKEN" "$releaseUrl/$CI_COMMIT_TAG")
      if [ "$status" = 200 ]; then
        curl -fsS -X PUT --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" \
          --data "{\"name\":\"$name\",\"description\":\"$description\"}" "$releaseUrl/$CI_COMMIT_TAG" >/dev/null
        for fileName in $(awk '{print $2}' cli-release/SHA256SUMS) SHA256SUMS; do
          linkStatus=$(curl -sS -o link.json -w '%{http_code}' -X POST --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" \
            --data "{\"name\":\"$fileName\",\"url\":\"$CLI_PACKAGE_URL/$fileName\",\"link_type\":\"package\",\"direct_asset_path\":\"/$fileName\"}" "$releaseUrl/$CI_COMMIT_TAG/assets/links")
          case "$linkStatus" in
            201) echo "linked $fileName" ;;
            400|409) echo "$fileName is already linked" ;;
            *) cat link.json; exit 1 ;;
          esac
        done
        echo "Updated the release $CI_COMMIT_TAG"
      else
        curl -fsS -X POST --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" \
          --data "{\"tag_name\":\"$CI_COMMIT_TAG\",\"name\":\"$name\",\"description\":\"$description\",\"assets\":{\"links\":[$allLink]}}" "$releaseUrl" >/dev/null
        echo "Created the release $CI_COMMIT_TAG"
      fi
