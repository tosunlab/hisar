services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hisar
      POSTGRES_DB: hisar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hisar"]
      interval: 5s
      retries: 10

  hisar:
    image: ${HISAR_IMAGE:-ghcr.io/tosunlab/hisar-server}:${HISAR_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: hisar.env
    environment:
      HISAR_PUBLIC_URL: https://${HISAR_DOMAIN:?set HISAR_DOMAIN in .env}
      HISAR_TRUST_PROXY: "true"
      # Desktop app updates from GitHub Releases; empty means tosunlab/hisar without a token, "off" disables them.
      HISAR_DESKTOP_UPDATE_GITHUB_REPOSITORY: ${HISAR_DESKTOP_UPDATE_GITHUB_REPOSITORY:-}
      HISAR_DESKTOP_UPDATE_GITHUB_TOKEN: ${HISAR_DESKTOP_UPDATE_GITHUB_TOKEN:-}
      # Instance settings from .env; empty leaves them to the admin dashboard. Any HISAR_SMTP_* value sets all of Email.
      HISAR_SMTP_HOST: ${HISAR_SMTP_HOST:-}
      HISAR_SMTP_PORT: ${HISAR_SMTP_PORT:-}
      HISAR_SMTP_USERNAME: ${HISAR_SMTP_USERNAME:-}
      HISAR_SMTP_PASSWORD: ${HISAR_SMTP_PASSWORD:-}
      HISAR_SMTP_FROM: ${HISAR_SMTP_FROM:-}
      HISAR_MINIMUM_VERSION_DESKTOP_MACOS: ${HISAR_MINIMUM_VERSION_DESKTOP_MACOS:-}
      HISAR_MINIMUM_VERSION_IOS: ${HISAR_MINIMUM_VERSION_IOS:-}
      HISAR_MINIMUM_VERSION_CLI: ${HISAR_MINIMUM_VERSION_CLI:-}
      HISAR_MINIMUM_VERSION_EXTENSION: ${HISAR_MINIMUM_VERSION_EXTENSION:-}
      HISAR_AUTH_BURST: ${HISAR_AUTH_BURST:-}
    volumes:
      - hisar-data:/data
    ports:
      - 127.0.0.1:${HISAR_PORT:-8080}:8080

secrets:
  db_password:
    file: db_password.txt

volumes:
  pgdata:
  hisar-data:
