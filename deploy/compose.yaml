services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hisar
      POSTGRES_DB: hisar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hisar"]
      interval: 5s
      retries: 10

  hisar:
    image: ${HISAR_IMAGE:?set HISAR_IMAGE in .env}:${HISAR_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: hisar.env
    environment:
      HISAR_PUBLIC_URL: https://${HISAR_DOMAIN:?set HISAR_DOMAIN in .env}
      HISAR_TRUST_PROXY: "true"
      # Optional desktop app updates; empty disables them.
      HISAR_UPDATE_GITLAB_URL: ${HISAR_UPDATE_GITLAB_URL:-}
      HISAR_UPDATE_GITLAB_PROJECT_ID: ${HISAR_UPDATE_GITLAB_PROJECT_ID:-}
      HISAR_UPDATE_GITLAB_TOKEN: ${HISAR_UPDATE_GITLAB_TOKEN:-}
      # Optional email for invites and share invitations; empty disables it.
      HISAR_SMTP_HOST: ${HISAR_SMTP_HOST:-}
      HISAR_SMTP_PORT: ${HISAR_SMTP_PORT:-}
      HISAR_SMTP_USERNAME: ${HISAR_SMTP_USERNAME:-}
      HISAR_SMTP_PASSWORD: ${HISAR_SMTP_PASSWORD:-}
      HISAR_SMTP_FROM: ${HISAR_SMTP_FROM:-}
      # Optional plans sold through Lemon Squeezy; empty sells nothing.
      HISAR_LEMON_SQUEEZY_API_KEY: ${HISAR_LEMON_SQUEEZY_API_KEY:-}
      HISAR_LEMON_SQUEEZY_STORE_ID: ${HISAR_LEMON_SQUEEZY_STORE_ID:-}
      HISAR_LEMON_SQUEEZY_WEBHOOK_SECRET: ${HISAR_LEMON_SQUEEZY_WEBHOOK_SECRET:-}
      HISAR_LEMON_SQUEEZY_MONTHLY_VARIANT_ID: ${HISAR_LEMON_SQUEEZY_MONTHLY_VARIANT_ID:-}
      HISAR_LEMON_SQUEEZY_YEARLY_VARIANT_ID: ${HISAR_LEMON_SQUEEZY_YEARLY_VARIANT_ID:-}
      HISAR_LEMON_SQUEEZY_REDIRECT_URL: ${HISAR_LEMON_SQUEEZY_REDIRECT_URL:-}
    volumes:
      - hisar-data:/data
    ports:
      - 127.0.0.1:${HISAR_PORT:-8080}:8080

secrets:
  db_password:
    file: db_password.txt

volumes:
  pgdata:
  hisar-data:
