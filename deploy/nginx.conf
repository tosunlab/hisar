server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hisar.example.com;

    ssl_certificate     /etc/letsencrypt/live/hisar.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hisar.example.com/privkey.pem;

    # Vault key rotation uploads every item of a vault at once.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-sent events for instant sync: no buffering, and a timeout well above the 25 s heartbeat.
    location = /api/v1/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hisar.example.com;
    return 301 https://$host$request_uri;
}
