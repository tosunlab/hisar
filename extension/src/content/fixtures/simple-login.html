<header>
  <form role="search" action="/search"><input type="search" name="q" placeholder="Search or jump to…" /></form>
  <form action="/search-legacy"><input type="text" name="query" placeholder="Search" /></form>
</header>
<main>
  <h1>Sign in to Example</h1>
  <form id="login" action="/session" method="post">
    <input type="hidden" name="authenticity_token" value="abc" />
    <label for="login_field">Username or email address</label>
    <input type="text" name="login" id="login_field" autocapitalize="off" autocomplete="username" />
    <label for="password">Password</label>
    <input type="password" name="password" id="password" autocomplete="current-password" />
    <input type="checkbox" name="remember" id="remember" /> <label for="remember">Keep me signed in</label>
    <input type="submit" name="commit" value="Sign in" id="sign-in" />
  </form>
</main>
<footer>
  <form id="newsletter" action="/subscribe">
    <input type="email" name="newsletter_email" placeholder="Subscribe to our newsletter" />
    <button type="submit">Subscribe</button>
  </form>
</footer>
