<form id="address">
  <label for="street">Street address</label>
  <input id="street" name="street" autocomplete="street-address" />
  <label for="region">Province</label>
  <select id="region" name="province">
    <option value="">Province</option>
    <option value="ON">Ontario</option>
    <option value="IL">Illinois</option>
  </select>
  <label for="country-name">Country</label>
  <select id="country-name" name="country">
    <option value="">Select</option>
    <option>Germany</option>
    <option>United States</option>
  </select>
  <label for="country-text">Country code</label>
  <input id="country-text" name="country_code" autocomplete="country" />
  <button type="submit">Save</button>
</form>
