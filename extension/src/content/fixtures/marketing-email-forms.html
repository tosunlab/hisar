<main>
  <!-- A code host's home page: a sign-up call to action that asks for the email alone, as GitHub's does. -->
  <section class="hero">
    <h1>Build and ship software</h1>
    <form action="/signup" method="get">
      <input type="email" name="user_email" id="hero_user_email" placeholder="you@domain.com" autocomplete="email" aria-label="Enter your email" />
      <button type="submit">Sign up for GitHub</button>
    </form>
  </section>
  <!-- A guest checkout's email step, which goes on to the shipping address. -->
  <form id="guest" action="/checkout/contact" method="post">
    <label for="guest-email">Email address</label>
    <input type="email" id="guest-email" name="email" />
    <button type="submit">Continue to shipping</button>
  </form>
</main>
<footer>
  <!-- A shop's footer, as Target's: an email box under "Sign up for emails". -->
  <form action="/email-signup" method="post">
    <h2>Sign up for emails</h2>
    <label for="email-address">Email address</label>
    <input type="text" id="email-address" name="email-address" placeholder=" " autocomplete="on" />
    <button type="submit">Sign up</button>
  </form>
</footer>
