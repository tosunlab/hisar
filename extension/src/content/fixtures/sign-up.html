<form id="sign-up" action="/users" method="post">
  <input type="text" name="full_name" autocomplete="name" placeholder="Full name" />
  <input type="email" name="email" autocomplete="email" placeholder="Email" />
  <input type="password" name="password" id="new-password" placeholder="Create a password" />
  <input type="password" name="password_confirmation" id="confirm-password" placeholder="Repeat the password" />
  <button type="submit">Create account</button>
</form>
