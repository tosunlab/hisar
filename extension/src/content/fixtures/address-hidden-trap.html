<form id="signup-offer">
  <label for="email">Email for offers</label>
  <input id="email" name="email" type="email" autocomplete="email" />
  <input id="visible-postal" name="zip" autocomplete="postal-code" />
  <div style="display: none">
    <input id="hidden-street" name="street" autocomplete="street-address" />
    <input id="hidden-city" name="city" autocomplete="address-level2" />
  </div>
  <input id="transparent-street" name="street2" autocomplete="street-address" style="opacity: 0; position: absolute" />
  <div style="opacity: 0.01"><input id="faded-region" name="region" autocomplete="address-level1" /></div>
  <input id="disabled-city" name="city2" autocomplete="address-level2" disabled />
  <input id="readonly-country" name="country" autocomplete="country" readonly />
  <button type="submit">Get offers</button>
</form>
