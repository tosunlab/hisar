<form id="change-password" action="/settings/password" method="post">
  <input type="text" name="username" autocomplete="username" value="alex@example.com" readonly />
  <input type="password" name="old" id="current" />
  <input type="password" name="new" id="next-password" />
  <input type="password" name="confirm" id="confirm" />
  <button type="submit">Update password</button>
</form>
